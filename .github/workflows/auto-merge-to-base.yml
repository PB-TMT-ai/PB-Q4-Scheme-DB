name: Auto-merge to base

on:
  push:
    branches:
      - 'claude/**'
      - 'main'
      - 'master'

jobs:
  merge-to-base:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge into base
        run: |
          git checkout base
          git merge origin/${{ github.ref_name }} --no-edit
          git push origin base

      - name: Sync deployed branch with base
        if: github.ref_name != 'claude/dealer-slab-color-coding-dFor3'
        run: |
          git checkout claude/dealer-slab-color-coding-dFor3
          git merge base --no-edit
          git push origin claude/dealer-slab-color-coding-dFor3
